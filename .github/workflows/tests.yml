name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # The runner's system SQLite may predate the WAL-reset fix required by ADR 0002.
      - run: uv python install 3.12
      - run: uv run --no-project --python 3.12 python -c 'import sqlite3; print(sqlite3.sqlite_version)'
      - run: uv sync --dev
      - run: uv run pytest -q
      - run: uv run film-iq --version
      - run: uv run film-iq status

