services:
  tmdb-fixture:
    image: python:3.12.12-slim@sha256:f3fa41d74a768c2fce8016b98c191ae8c1bacd8f1152870a3f9f87d350920b7c
    profiles: [tmdb-fixture]
    network_mode: service:youtrack
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: /opt/filmiq/bridge:/opt/filmiq/poc:/opt/filmiq/src
    volumes:
      - ./youtrack-tmdb-bridge-poc:/opt/filmiq/bridge:ro
      - ./tmdb_readonly.py:/opt/filmiq/poc/tmdb_readonly.py:ro
      - ../../../src:/opt/filmiq/src:ro
    command: ["python", "/opt/filmiq/bridge/serve_fixture.py"]
    restart: "no"
