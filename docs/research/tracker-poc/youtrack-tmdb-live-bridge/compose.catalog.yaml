      - ./reviewed_catalog.py:/opt/filmiq/poc/reviewed_catalog.py:ro
      - "${FILMIQ_REVIEWED_CATALOG_FILE:?Set the existing reviewed catalog file}:/run/filmiq/reviewed-catalog.json:ro"
